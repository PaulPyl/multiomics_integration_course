[workspace]
name = "KIMN20_2026"
version = "2026.0.0"
description = "Multi-Omics Integration — KIMN20 lecture and labs (MOFA2 / mixOmics DIABLO)"
authors = ["Paul-Theodor Pyl <paul-theodor.pyl@scilifelab.se>"]
channels = ["conda-forge", "bioconda"]
# bioconda publishes no win-64 builds, so Windows students use WSL2
# (or a course server). See README.
platforms = ["osx-arm64", "osx-64", "linux-64"]

[tasks]
# One-time step: install the handful of R packages that are not on conda.
# MOFA2 is not published on bioconda, so it comes from Bioconductor into a
# project-local library (see .Rprofile).
setup = "Rscript setup/install_r_extras.R"
# Render every lab in labs/ to HTML.
render-labs = "Rscript -e 'for (f in list.files(\"labs\", pattern = \"[.]Rmd$\", full.names = TRUE)) rmarkdown::render(f)'"
# Render the lecture deck to self-contained HTML.
slides = "quarto render lecture/slides.qmd"
check = "Rscript setup/check_env.R"
rstudio = "open -n -a RStudio ."

[activation.env]
# Directory-independent, so R finds these no matter which subdirectory it is
# started from (knitting from labs/ sets the cwd to labs/).
R_LIBS_USER       = "$PIXI_PROJECT_ROOT/.Rlibrary"
RETICULATE_PYTHON = "$PIXI_PROJECT_ROOT/.pixi/envs/default/bin/python"
# Cut off any site library inherited from the host. RStudio Server's terminal
# exports R_LIBS_SITE pointing at the *system* R's libraries (R 4.6 there), and
# pixi's R (4.5) would then search them ahead of its own: a stale BiocVersion
# there made BiocManager pick a Bioconductor release that does not match this R,
# and any package present in both places would load the wrong build. An empty
# value means "no site library" (R's Renviron only applies its default when the
# variable is unset, not when it is empty).
R_LIBS_SITE       = ""

[dependencies]
# --- core ---
r-base = "4.5.*"
r-tidyverse = "*"
"r-data.table" = "*"
r-ggplot2 = "*"
r-rmarkdown = "*"
quarto = "*"
r-knitr = "*"
r-here = "*"

# --- lab-specific R ---
r-randomforest = "*"
r-survival = "*"
r-survminer = "*"
r-pheatmap = "*"
r-magick = "*"   # knitr/BiocStyle figure cropping

# --- lecture figures (rendered in slides.qmd, not shipped as images) ---
r-glmnet = "*"
r-patchwork = "*"
r-ggrepel = "*"
r-psych = "*"
r-reticulate = "*"
r-biocmanager = "*"

# --- Bioconductor from bioconda ---
bioconductor-mixomics = "*"
bioconductor-biocstyle = "*"
# NOTE: bioconductor-mofadata is deliberately NOT listed here. On bioconda it is
# a data package that installs itself from a post-link script, and pixi disables
# post-link scripts by default -- the package would resolve and link but the R
# library would never actually contain it. It is installed by `pixi run setup`
# instead, alongside MOFA2.
bioconductor-rhdf5 = "*"
bioconductor-delayedarray = "*"
bioconductor-hdf5array = "*"
bioconductor-annotationhub = "*"
bioconductor-ensembldb = "*"

# --- MOFA python backend ---
# Installed directly so MOFA2 can use this interpreter via reticulate and we
# never need basilisk to download its own environment at lab time.
mofapy2 = "*"
python = "3.12.*"
# Not used directly. reticulate treats any Python inside a conda-style env (one
# with conda-meta/) as a conda env and, before loading it, runs `conda run` to
# compute its PATH. With no conda/mamba/micromamba on PATH that fails, reticulate
# quietly discards RETICULATE_PYTHON and falls back to a scratch Python that has
# no mofapy2, and run_mofa() then reports "mofapy2 is not detected". reticulate's
# find_conda() accepts micromamba, so shipping it in the env makes the pixi Python
# usable on machines that have no conda of their own.
micromamba = ">=2.10.0,<3"
